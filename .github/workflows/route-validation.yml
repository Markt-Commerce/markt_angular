name: Route Validation

on:
  pull_request:
    paths:
      - 'src/app/**/*.ts'
      - 'src/app/core/config/**'
      - 'scripts/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/app/**/*.ts'
      - 'src/app/core/config/**'

jobs:
  validate-routes:
    name: Validate Route Constants
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run route validation
        run: node scripts/validate-routes-simple.js
        continue-on-error: false

      - name: Run route-state map validation
        run: node scripts/validate-state-map-simple.js
        continue-on-error: false

      - name: Check for hardcoded routes
        run: |
          echo "Checking for hardcoded route strings..."
          
          # Search for common hardcoded route patterns
          HARDCODED_ROUTES=$(grep -r "navigate(\['\/" --include="*.ts" src/app/ || true)
          HARDCODED_ROUTER_LINKS=$(grep -r "routerLink=\"/\|routerLink='\/" --include="*.ts" --include="*.html" src/app/ || true)
          
          if [ ! -z "$HARDCODED_ROUTES" ] || [ ! -z "$HARDCODED_ROUTER_LINKS" ]; then
            echo "❌ Found hardcoded route strings:"
            echo "$HARDCODED_ROUTES"
            echo "$HARDCODED_ROUTER_LINKS"
            echo ""
            echo "Please use ROUTES_ABSOLUTE constants instead."
            exit 1
          fi
          
          echo "✅ No hardcoded route strings found"

  guard-tests:
    name: Run Guard Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run guard integration tests
        run: npm run test -- --include='**/guards/**/*.spec.ts' --watch=false

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  architecture-report:
    name: Generate Architecture Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate route report
        run: |
          echo "## Route Architecture Report" > route-report.md
          echo "" >> route-report.md
          echo "**Total Routes:** $(grep -c "ROUTES_ABSOLUTE\." src/app/core/config/routes.config.ts || echo 0)" >> route-report.md
          echo "" >> route-report.md
          echo "**Route State Map Entries:** $(grep -c "^\[ROUTES_ABSOLUTE\." src/app/core/config/route-state-map.ts || echo 0)" >> route-report.md
          echo "" >> route-report.md
          echo "### Validation Status" >> route-report.md
          echo "- ✅ Route constants validated" >> route-report.md
          echo "- ✅ Route-state map validated" >> route-report.md
          echo "- ✅ No hardcoded route strings" >> route-report.md
          echo "- ✅ Guard tests passing" >> route-report.md
          
          cat route-report.md

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('route-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

